<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/delivery-problems.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-wordmark"><h2>NORREN<span>ALERTS</span></h2></div>
        <nav aria-label="Main navigation">
            <a class="nav-item" href="/"><span class="nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg></span>Dashboard</a>

                <div class="sidebar-profile-details"><strong id="userName">Loading...</strong><small id="userRole">Administrator</small></div>
            </div>
            <a class="logout-button sidebar-logout" href="/api/auth/logout" aria-label="Log out" title="Log out">Log out</a>
        </div>
    </aside>
    <main class="main">
        <header class="topbar"><div><h1>Delivery problems</h1></div></header>
        <section class="content">
            <p id="deliveryProblemsMessage" class="delivery-problems-message" role="status" aria-live="polite"></p>
            <div class="table-container">
                <table>
                    <thead><tr><th>Recipient</th><th>Title</th><th>Due date</th><th>Action</th></tr></thead>
                    <tbody id="deliveryProblemsTable"><tr><td colspan="4">Loading delivery problems...</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="/js/delivery-problems.js" defer></script>
